server.port=8085

# Database Configuration (H2 in-memory by default for development and fast benchmark, configurable for PostgreSQL)
spring.datasource.url=jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Settings (T0 benchmark spec)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Variante A : Jersey JAX-RS path
spring.jersey.application-path=/api/jersey
spring.jersey.type=filter

# Variante D : Spring Data REST base path
spring.data.rest.base-path=/api/data-rest
spring.data.rest.default-page-size=20
spring.data.rest.max-page-size=100

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
